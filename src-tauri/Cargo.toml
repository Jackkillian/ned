[package]
name = "ned"
version = "0.1.0"
description = "A Tauri App"
authors = ["Jackkillian"]
edition = "2021"

[lib]
name = "ned_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chlorine = { path = "./chlorine" }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["time"] }
tauri-plugin-dialog = "2"
rodio = "0.22.2"
config = "0.15.25"

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow", "objc2-core-foundation"] }

[workspace]
resolver = "3"
members = ["chlorine"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
